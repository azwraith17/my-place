<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — My Place</title>
  <link rel="stylesheet" href="/css/base.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      width: min(360px, 90vw);
    }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; text-align: center; }
    form { display: flex; flex-direction: column; gap: 1rem; }
    input[type="password"] { width: 100%; }
    .err { color: var(--danger); font-size: 0.85rem; text-align: center; display: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>My Place</h1>
    <form id="login-form">
      <input type="password" id="pw" placeholder="Password" autofocus autocomplete="current-password">
      <p class="err" id="err-msg">Wrong password</p>
      <button type="submit" class="btn" style="justify-content:center">Sign in</button>
    </form>
  </div>
  <script type="module">
    const form = document.getElementById('login-form');
    const err  = document.getElementById('err-msg');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const pw = document.getElementById('pw').value;
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ password: pw }),
        credentials: 'include',
      });
      if (res.ok) {
        const next = new URLSearchParams(location.search).get('next') || '/library.html';
        location.href = next;
      } else {
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
