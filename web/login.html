<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — My Place</title>
  <link rel="stylesheet" href="/css/base.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 0%, #0e0e2a 0%, #0a0a1e 45%, #060614 100%);
      position: relative;
      overflow: hidden;
    }

    /* Pixel star field background */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .stars::before {
      content: '';
      position: absolute;
      width: 2px;
      height: 2px;
      background: transparent;
      box-shadow:
        60px 40px 0 rgba(107,140,255,0.55),
        200px 22px 0 rgba(192,80,255,0.45),
        380px 58px 0 rgba(64,192,192,0.5),
        550px 32px 0 rgba(255,192,64,0.45),
        720px 50px 0 rgba(107,140,255,0.4),
        900px 28px 0 rgba(220,80,80,0.4),
        1100px 44px 0 rgba(192,80,255,0.5),
        1300px 36px 0 rgba(64,192,192,0.4),
        1440px 18px 0 rgba(255,192,64,0.4),
        30px 300px 0 rgba(255,192,64,0.4),
        150px 400px 0 rgba(107,140,255,0.5),
        320px 350px 0 rgba(192,80,255,0.35),
        480px 420px 0 rgba(64,192,192,0.45),
        650px 380px 0 rgba(255,192,64,0.35),
        820px 440px 0 rgba(107,140,255,0.4),
        1000px 370px 0 rgba(220,80,80,0.45),
        1180px 450px 0 rgba(192,80,255,0.35),
        1380px 400px 0 rgba(64,192,192,0.45),
        80px 700px 0 rgba(255,192,64,0.35),
        300px 750px 0 rgba(107,140,255,0.45),
        600px 800px 0 rgba(192,80,255,0.35),
        900px 720px 0 rgba(64,192,192,0.4),
        1200px 780px 0 rgba(220,80,80,0.35),
        450px 600px 0 rgba(107,140,255,0.3),
        760px 550px 0 rgba(255,192,64,0.3),
        1050px 620px 0 rgba(192,80,255,0.3),
        180px 880px 0 rgba(64,192,192,0.3),
        520px 920px 0 rgba(107,140,255,0.3),
        840px 880px 0 rgba(255,192,64,0.3),
        1150px 940px 0 rgba(192,80,255,0.25);
    }

    .login-card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 2px);
      padding: 2.25rem 2rem;
      width: min(360px, 90vw);
      box-shadow: var(--shadow-lg), 0 0 0 1px rgba(107,140,255,0.08);
    }

    /* Pixel art bookshelf logo */
    .login-logo {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .pixel-shelf {
      display: block;
      margin: 0 auto 1rem;
    }
    .login-logo-text {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.12em;
      display: block;
      margin-bottom: 0.2rem;
    }
    .login-logo-sub {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    form { display: flex; flex-direction: column; gap: 1rem; }
    input[type="password"] { width: 100%; font-size: 0.95rem; }
    .err { color: var(--danger); font-size: 0.85rem; text-align: center; display: none; }
    .btn[type="submit"] { justify-content: center; font-size: 0.9rem; padding: 0.55em 1.1em; }
  </style>
</head>
<body>
  <!-- Pixel star field -->
  <div class="stars" aria-hidden="true"></div>

  <div class="login-card">
    <div class="login-logo">
      <!-- Pixel art bookshelf — 5 books, all landing on shelf at y=60 -->
      <svg class="pixel-shelf" width="160" height="76" viewBox="0 0 160 76"
           xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
        <!-- Book 1: purple, h=52 -->
        <rect x="8"  y="8"  width="24" height="52" fill="#501480"/>
        <rect x="8"  y="8"  width="4"  height="52" fill="#2d0a42"/>
        <rect x="30" y="8"  width="2"  height="52" fill="#c8b99a"/>
        <rect x="8"  y="8"  width="24" height="1"  fill="#ffffff" opacity="0.08"/>
        <rect x="12" y="20" width="16" height="2"  fill="#c050ff"/>
        <rect x="12" y="24" width="10" height="2"  fill="#9040cc"/>
        <rect x="12" y="32" width="16" height="2"  fill="#e0a0ff"/>
        <rect x="12" y="36" width="10" height="2"  fill="#e0a0ff"/>

        <!-- Book 2: teal, h=40 -->
        <rect x="36" y="20" width="20" height="40" fill="#14605a"/>
        <rect x="36" y="20" width="4"  height="40" fill="#0a2d2a"/>
        <rect x="54" y="20" width="2"  height="40" fill="#c8b99a"/>
        <rect x="36" y="20" width="20" height="1"  fill="#ffffff" opacity="0.08"/>
        <rect x="40" y="30" width="12" height="2"  fill="#40c0c0"/>
        <rect x="40" y="34" width="8"  height="2"  fill="#40c0c0"/>
        <rect x="40" y="38" width="6"  height="2"  fill="#90dcd8"/>

        <!-- Book 3: gold, h=46 -->
        <rect x="60" y="14" width="22" height="46" fill="#805020"/>
        <rect x="60" y="14" width="4"  height="46" fill="#403010"/>
        <rect x="80" y="14" width="2"  height="46" fill="#c8b99a"/>
        <rect x="60" y="14" width="22" height="1"  fill="#ffffff" opacity="0.08"/>
        <rect x="64" y="24" width="14" height="2"  fill="#ffc040"/>
        <rect x="64" y="28" width="10" height="2"  fill="#ffc040"/>
        <rect x="64" y="36" width="14" height="2"  fill="#ffe090"/>
        <rect x="64" y="40" width="8"  height="2"  fill="#ffe090"/>

        <!-- Book 4: blue, tallest h=54 -->
        <rect x="86"  y="6"  width="26" height="54" fill="#162080"/>
        <rect x="86"  y="6"  width="4"  height="54" fill="#0a1442"/>
        <rect x="110" y="6"  width="2"  height="54" fill="#c8b99a"/>
        <rect x="86"  y="6"  width="26" height="1"  fill="#ffffff" opacity="0.08"/>
        <rect x="90"  y="16" width="18" height="2"  fill="#4a6fff"/>
        <rect x="90"  y="20" width="12" height="2"  fill="#4a6fff"/>
        <rect x="90"  y="30" width="18" height="2"  fill="#8faaff"/>
        <rect x="90"  y="34" width="12" height="2"  fill="#8faaff"/>
        <rect x="90"  y="38" width="8"  height="2"  fill="#8faaff"/>

        <!-- Book 5: red, h=42 -->
        <rect x="116" y="18" width="20" height="42" fill="#802030"/>
        <rect x="116" y="18" width="4"  height="42" fill="#401018"/>
        <rect x="134" y="18" width="2"  height="42" fill="#c8b99a"/>
        <rect x="116" y="18" width="20" height="1"  fill="#ffffff" opacity="0.08"/>
        <rect x="120" y="28" width="12" height="2"  fill="#ff6060"/>
        <rect x="120" y="32" width="8"  height="2"  fill="#ff6060"/>
        <rect x="120" y="36" width="6"  height="2"  fill="#ffb0b0"/>

        <!-- Shelf plank -->
        <rect x="0"  y="60" width="160" height="8"  fill="#2e2e38"/>
        <rect x="0"  y="68" width="160" height="4"  fill="#1e1e24"/>
        <rect x="0"  y="72" width="160" height="2"  fill="#0d0d14" opacity="0.8"/>
        <rect x="0"  y="74" width="160" height="2"  fill="#0d0d14" opacity="0.4"/>
        <!-- Shelf top highlight -->
        <rect x="0"  y="60" width="160" height="1"  fill="#ffffff" opacity="0.06"/>
      </svg>

      <span class="login-logo-text">my place</span>
      <span class="login-logo-sub">private space</span>
    </div>

    <form id="login-form">
      <input type="password" id="pw" placeholder="Password" autofocus autocomplete="current-password">
      <p class="err" id="err-msg">Wrong password</p>
      <button type="submit" class="btn" style="justify-content:center">Sign in</button>
    </form>
  </div>

  <script type="module">
    const form = document.getElementById('login-form');
    const err  = document.getElementById('err-msg');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const pw = document.getElementById('pw').value;
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ password: pw }),
        credentials: 'include',
      });
      if (res.ok) {
        const next = new URLSearchParams(location.search).get('next') || '/library.html';
        location.href = next;
      } else {
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
