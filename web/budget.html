<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget — Library</title>
  <link rel="stylesheet" href="/css/base.css">
  <style>
    .budget-top {
      padding: 1.5rem 2rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .month-nav { display: flex; align-items: center; gap: 0.8rem; }
    .month-nav span { min-width: 8rem; text-align: center; font-weight: 500; }

    .summary { display: flex; gap: 1rem; flex-wrap: wrap; }
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.6rem 1.2rem;
      min-width: 110px;
    }
    .summary-card .label { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 0.2rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .summary-card .value { font-size: 1.15rem; font-weight: 600; }
    .income  { color: #4caf7d; }
    .expense { color: var(--danger); }

    #add-area { padding: 0 2rem 1.2rem; }
    #add-form {
      margin-top: 0.8rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      display: none;
      grid-template-columns: auto 1fr 1fr 1fr auto;
      gap: 0.7rem;
      align-items: end;
    }
    #add-form.open { display: grid; }
    @media (max-width: 720px) { #add-form.open { grid-template-columns: 1fr 1fr; } }

    .type-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .type-toggle button {
      padding: 0.4em 0.9em;
      font-size: 0.85rem;
      border-radius: 0;
      flex: 1;
    }
    .type-toggle button.active { background: var(--accent); color: #fff; }
    .type-toggle button:not(.active):hover { background: var(--surface2); }

    .form-field { display: flex; flex-direction: column; gap: 0.25rem; }
    .form-field label { font-size: 0.75rem; color: var(--text-muted); }
    .form-actions { display: flex; gap: 0.5rem; align-items: flex-end; }

    #txn-list { padding: 0 2rem 3rem; }
    .day-group { margin-bottom: 1.2rem; }
    .day-header {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.3rem 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.3rem;
    }
    .txn-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.45rem 0.4rem;
      border-radius: 4px;
    }
    .txn-row:hover { background: var(--surface); }
    .txn-row:hover .txn-delete { visibility: visible; }
    .txn-cat {
      background: var(--surface2);
      border-radius: 4px;
      padding: 0.1em 0.5em;
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .txn-desc { flex: 1; font-size: 0.9rem; color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .txn-amount { font-weight: 600; font-size: 0.95rem; white-space: nowrap; flex-shrink: 0; }
    .txn-delete { visibility: hidden; color: var(--text-muted); font-size: 0.8rem; padding: 0.1em 0.4em; flex-shrink: 0; }
    .txn-delete:hover { color: var(--danger); }

    .empty-msg { text-align: center; color: var(--text-muted); padding: 3rem; }
    .toast-area { position: fixed; bottom: 1.5rem; right: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: 9999; }
  </style>
</head>
<body>
  <!-- header and nav injected by nav.js -->

  <div class="budget-top">
    <div class="month-nav">
      <button class="btn btn-ghost" id="prev-month">&larr;</button>
      <span id="month-label"></span>
      <button class="btn btn-ghost" id="next-month">&rarr;</button>
    </div>
    <div class="summary">
      <div class="summary-card">
        <div class="label">Income</div>
        <div class="value income" id="sum-income">0.00</div>
      </div>
      <div class="summary-card">
        <div class="label">Expenses</div>
        <div class="value expense" id="sum-expense">0.00</div>
      </div>
      <div class="summary-card">
        <div class="label">Balance</div>
        <div class="value" id="sum-balance">0.00</div>
      </div>
    </div>
  </div>

  <div id="add-area">
    <button class="btn" id="add-btn">+ Add</button>
    <form id="add-form">
      <div class="form-field">
        <label>Type</label>
        <div class="type-toggle">
          <button type="button" id="type-income" class="active">Income</button>
          <button type="button" id="type-expense">Expense</button>
        </div>
      </div>
      <div class="form-field">
        <label>Amount</label>
        <input type="number" id="f-amount" placeholder="0.00" step="0.01" min="0" required>
      </div>
      <div class="form-field">
        <label>Category</label>
        <input type="text" id="f-category" placeholder="e.g. Food">
      </div>
      <div class="form-field">
        <label>Description</label>
        <input type="text" id="f-desc" placeholder="Note">
      </div>
      <div class="form-field">
        <label>Date</label>
        <input type="date" id="f-date" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn">Save</button>
        <button type="button" class="btn btn-ghost" id="cancel-btn">Cancel</button>
      </div>
    </form>
  </div>

  <div id="txn-list"></div>
  <div class="toast-area" id="toast-area"></div>

  <script type="module" src="/js/budget.js"></script>
</body>
</html>
