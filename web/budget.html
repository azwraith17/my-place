<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget — My Place</title>
  <link rel="stylesheet" href="/css/base.css">
  <style>
    .budget-top {
      padding: 1.25rem 2rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .month-nav { display: flex; align-items: center; gap: 0.7rem; }
    .month-nav span { min-width: 9rem; text-align: center; font-weight: 500; font-size: 0.95rem; }

    .summary { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left-width: 3px;
      border-radius: var(--radius);
      padding: 0.6rem 1.1rem;
      min-width: 110px;
      box-shadow: var(--shadow-sm);
    }
    .summary-card.card-income  { border-left-color: var(--success); }
    .summary-card.card-expense { border-left-color: var(--danger); }
    .summary-card.card-balance { border-left-color: var(--accent); }
    .summary-card .label {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 500;
    }
    .summary-card .value { font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .income  { color: var(--success); }
    .expense { color: var(--danger); }

    #add-area { padding: 0 2rem 1.2rem; }
    #add-form {
      margin-top: 0.8rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      display: none;
      grid-template-columns: auto 1fr 1fr 1fr auto;
      gap: 0.75rem;
      align-items: end;
      box-shadow: var(--shadow-sm);
    }
    #add-form.open { display: grid; }
    @media (max-width: 720px) { #add-form.open { grid-template-columns: 1fr 1fr; } }

    .type-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .type-toggle button {
      padding: 0.42em 0.9em;
      font-size: 0.84rem;
      border-radius: 0;
      flex: 1;
      transition: background 0.15s, color 0.15s;
    }
    #type-income.active  { background: var(--success); color: #fff; }
    #type-expense.active { background: var(--danger);  color: #fff; }
    .type-toggle button:not(.active):hover { background: var(--surface2); }

    .form-field { display: flex; flex-direction: column; gap: 0.3rem; }
    .form-field label { font-size: 0.72rem; color: var(--text-muted); letter-spacing: 0.02em; }
    .form-actions { display: flex; gap: 0.5rem; align-items: flex-end; }

    #txn-list { padding: 0 2rem 3rem; }
    .day-group { margin-bottom: 1.4rem; }
    .day-header {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.3rem 0.4rem 0.3rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.2rem;
    }
    .txn-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.5rem 0.5rem;
      border-radius: var(--radius-sm);
      transition: background 0.12s;
    }
    .txn-row:hover { background: var(--surface2); }
    .txn-row:hover .txn-delete { visibility: visible; }
    .txn-cat {
      background: var(--surface3);
      border-radius: var(--radius-sm);
      padding: 0.15em 0.55em;
      font-size: 0.76rem;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .txn-desc {
      flex: 1;
      font-size: 0.88rem;
      color: var(--text);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .txn-amount {
      font-weight: 700;
      font-size: 0.92rem;
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .txn-delete {
      visibility: hidden;
      color: var(--text-muted);
      font-size: 0.78rem;
      padding: 0.1em 0.4em;
      flex-shrink: 0;
      transition: color 0.12s;
    }
    .txn-delete:hover { color: var(--danger); }

    .empty-msg { text-align: center; color: var(--text-muted); padding: 3rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <!-- header and nav injected by nav.js -->

  <div class="budget-top">
    <div class="month-nav">
      <button class="btn btn-ghost" id="prev-month">&larr;</button>
      <span id="month-label"></span>
      <button class="btn btn-ghost" id="next-month">&rarr;</button>
    </div>
    <div class="summary">
      <div class="summary-card card-income">
        <div class="label">Income</div>
        <div class="value income" id="sum-income">0.00</div>
      </div>
      <div class="summary-card card-expense">
        <div class="label">Expenses</div>
        <div class="value expense" id="sum-expense">0.00</div>
      </div>
      <div class="summary-card card-balance">
        <div class="label">Balance</div>
        <div class="value" id="sum-balance">0.00</div>
      </div>
    </div>
  </div>

  <div id="add-area">
    <button class="btn" id="add-btn">+ Add</button>
    <form id="add-form">
      <div class="form-field">
        <label>Type</label>
        <div class="type-toggle">
          <button type="button" id="type-income" class="active">Income</button>
          <button type="button" id="type-expense">Expense</button>
        </div>
      </div>
      <div class="form-field">
        <label>Amount</label>
        <input type="number" id="f-amount" placeholder="0.00" step="0.01" min="0" required>
      </div>
      <div class="form-field">
        <label>Category</label>
        <input type="text" id="f-category" placeholder="e.g. Food">
      </div>
      <div class="form-field">
        <label>Description</label>
        <input type="text" id="f-desc" placeholder="Note">
      </div>
      <div class="form-field">
        <label>Date</label>
        <input type="date" id="f-date" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn">Save</button>
        <button type="button" class="btn btn-ghost" id="cancel-btn">Cancel</button>
      </div>
    </form>
  </div>

  <div id="txn-list"></div>
  <div class="toast-area" id="toast-area"></div>

  <script type="module" src="/js/budget.js?v=3"></script>
</body>
</html>
