[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "reader-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2",
    "itsdangerous>=2.1",
    "pypdf>=4.2",
    "ebooklib>=0.18",
    "Pillow>=10.3",
    "httpx>=0.27",
    "python-magic>=0.4.27",
    "argostranslate>=1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
