server {
    listen 80;
    server_name _;

    # Static files
    root /usr/share/nginx/html;
    index index.html;

    # Auth subrequest endpoint
    location = /_auth {
        internal;
        proxy_pass         http://reader-api:8000/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header   Content-Length "";
        proxy_set_header   X-Original-URI $request_uri;
    }

    # API — proxy to FastAPI
    location /api/ {
        proxy_pass         http://reader-api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Large uploads (books can be big)
        client_max_body_size 200M;
        proxy_read_timeout   300s;
    }

    # Public — home page and login (no auth)
    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        try_files $uri =404;
    }
    location = /login.html {
        try_files $uri =404;
    }

    # Public — static assets needed by public pages
    location /css/ {
        try_files $uri =404;
    }
    location /vendor/ {
        try_files $uri =404;
    }

    # Everything else — require auth
    location / {
        auth_request /_auth;
        error_page 401 = @login_redirect;
        try_files $uri $uri/ /library.html;
    }

    location @login_redirect {
        return 302 /login.html?next=$request_uri;
    }
}
