# NOTE: This project runs as a systemd service (deploy/my-place.service) with
# system nginx proxying to uvicorn on port 8000. This compose file is kept for
# reference / local dev only and is NOT used in production.

services:
  reader-api:
    build: ./reader-api
    restart: unless-stopped
    environment:
      READER_PASSWORD: ${READER_PASSWORD}
      COOKIE_SECRET: ${COOKIE_SECRET}
      LIBRARY_PATH: /library
      DATA_PATH: /data
    volumes:
      - ./library:/library
      - ./data:/data
    ports:
      - "8000:8000"

  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/reader.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - reader-api
